*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Mali',-apple-system,'Segoe UI',sans-serif;font-weight:500;min-height:100vh;color:var(--text);-webkit-tap-highlight-color:transparent}
body{
  background:
    radial-gradient(circle at 8% 8%, rgba(139,124,246,.14), transparent 40%),
    radial-gradient(circle at 92% 18%, rgba(255,143,171,.16), transparent 42%),
    radial-gradient(circle at 50% 100%, rgba(95,217,192,.14), transparent 45%),
    var(--bg);
  animation:pageFadeIn .5s ease-out;
}
button,input,textarea,select{font-family:inherit}
a{text-decoration:none;color:inherit}
@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

:root{
  --purple:#8B7CF6;--purple-dark:#6C5CE7;--pink:#FF8FAB;--mint:#5FD9C0;--yellow:#FFC857;
  --bg:#FAF7FF;--bg2:#F1F0FE;--card:#FFFFFF;
  --text:#4A4560;--text-soft:#8B87A3;--border:#EFEBFB;
  --shadow:0 10px 28px -8px rgba(139,124,246,.28);--shadow-sm:0 4px 12px -4px rgba(139,124,246,.2);
}

/* ============ APP ============ */
.hw-app{display:block;min-height:100vh}
.hw-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1.5px solid var(--border)}
.hw-top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hw-pill{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:13px;color:var(--purple-dark);cursor:pointer;transition:transform .18s,box-shadow .18s}
a.hw-pill:hover,button.hw-pill:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.hw-pill.static{cursor:default;color:var(--text-soft)}
.hw-pill.static b{color:var(--text)}
.hw-wrap{max-width:860px;margin:0 auto;padding:26px 16px 70px}
.hw-hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:24px;gap:6px}
.hw-hero h1{font-family:'Baloo 2','Mali',sans-serif;font-weight:800;font-size:clamp(26px,5vw,34px);color:var(--purple-dark);line-height:1.15}
.hw-hero p{color:var(--text-soft);font-size:14px}
.hw-search{position:relative}
.hw-search input{width:100%;padding:13px 16px 13px 56px;border-radius:18px;border:1.5px solid var(--border);background:#fff;font-size:14.5px;outline:none;transition:border-color .2s;box-shadow:var(--shadow-sm)}
.hw-search input:focus{border-color:var(--purple)}
.hw-search .hw-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%)}
.hw-filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px;align-items:center}
.hw-filter{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:13px;color:var(--text-soft);cursor:pointer;transition:all .18s}
.hw-filter:hover{transform:translateY(-1px)}
.hw-filter.active{border-color:var(--purple);color:var(--purple-dark);background:#F5F2FF}
.hw-count{min-width:20px;padding:1px 7px;border-radius:999px;background:var(--bg2);font-size:11px;color:var(--text-soft);text-align:center}
.hw-filter.active .hw-count{background:var(--purple);color:#fff}
.hw-spacer{flex:1}
.hw-refresh.spinning .hw-svg{animation:spin .8s linear infinite}
#hwList .hw-card{animation:cardIn .45s ease-out both}
.hw-state{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:44px 16px;color:var(--text-soft);font-size:14px;line-height:1.6}
.hw-state b{color:var(--text);font-size:15px}
@media(max-width:560px){.hw-top{padding:8px 10px}.hw-pill span.lbl-long{display:none}}

/* ---------- Icon SVG: thay các phần tử data-hw-icon bằng SVG nét line ---------- */
function hwHydrateIcons(root){
  (root || document).querySelectorAll('[data-hw-icon]').forEach(function(el){
    if(el.dataset.done) return;
    var name = el.dataset.hwIcon, size = parseInt(el.dataset.size, 10) || 18;
    el.innerHTML = el.dataset.plain
      ? HwIcon(name, { size:size })
      : HwIcon.badge(name, el.dataset.tone, { box: parseInt(el.dataset.box, 10) || 36, size:size });
    el.dataset.done = '1';
  });
}
hwHydrateIcons();

/* ---------- Danh sách bài tập ---------- */
var _hwPosts = [];
var _hwFilter = 'all';
var _hwEntered = false;
var _hwPollTimer = null;
var _hwChannel = null;

function hwNorm(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
}
function hwTodayIso(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function hwWeekRange(){
  var d = new Date(); d.setHours(0,0,0,0);
  var dow = (d.getDay() + 6) % 7;            // Thứ Hai = 0
  var mon = new Date(d); mon.setDate(d.getDate() - dow);
  var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  var f = function(x){ return x.getFullYear() + '-' + ('0'+(x.getMonth()+1)).slice(-2) + '-' + ('0'+x.getDate()).slice(-2); };
  return [f(mon), f(sun)];
}
function hwSearchText(p){
  var parts = [p.title];
  if(p.kind === 'table' && p.content_table && p.content_table.cells){
    p.content_table.cells.forEach(function(r){ parts.push(r.join(' ').replace(/<[^>]*>/g, ' ')); });
  } else if(p.content_html){
    var tmp = document.createElement('div'); tmp.innerHTML = HwRender.sanitize(p.content_html);
    parts.push(tmp.textContent);
  }
  if(p.note_html){ var nt = document.createElement('div'); nt.innerHTML = HwRender.sanitize(p.note_html); parts.push(nt.textContent); }
  (p.attached_posts || []).forEach(function(a){ parts.push(a && a.title); });
  (p.images || []).forEach(function(im){ parts.push(im && im.caption); });
  return hwNorm(parts.join(' '));
}
function hwMatchesFilter(p, f){
  if(f === 'today') return p.homework_date === hwTodayIso();
  if(f === 'week'){ var r = hwWeekRange(); return p.homework_date >= r[0] && p.homework_date <= r[1]; }
  if(f === 'pinned') return !!p.is_pinned;
  return true;
}
function hwSetFilter(f){
  _hwFilter = f;
  document.querySelectorAll('.hw-filter').forEach(function(b){ b.classList.toggle('active', b.dataset.f === f); });
  hwApplyFilter();
}
var _hwOldShown = false;
function hwToggleOld(){
  _hwOldShown = !_hwOldShown;
  hwSyncOld();
}
function hwSyncOld(){
  var oldEl = document.getElementById('hwOld'), btn = document.getElementById('hwMoreBtn');
  oldEl.classList.toggle('show', _hwOldShown);
  btn.textContent = _hwOldShown ? 'Thu gọn lại' : 'Xem thêm bài tập cũ';
  btn.classList.toggle('collapse-mode', _hwOldShown);
}
function hwActivateGalleries(){
  try{ if(window.NoticeGallery) window.NoticeGallery.init(); }catch(e){ console.warn('Không bật được khung ảnh:', e); }
}
function hwApplyFilter(){
  var q = hwNorm(document.getElementById('hwSearch').value.trim());
  var hasFilter = _hwFilter !== 'all' || !!q;
  var list = _hwPosts.filter(function(p){
    return hwMatchesFilter(p, _hwFilter) && (!q || p._search.indexOf(q) !== -1);
  });
  var box = document.getElementById('hwList');
  var oldEl = document.getElementById('hwOld');
  var moreBtn = document.getElementById('hwMoreBtn');
  if(!list.length){
    oldEl.innerHTML = ''; moreBtn.style.display = 'none';
    box.innerHTML = '<div class="hw-state">' + HwIcon.badge('inbox', 'lavender', { box:64, size:32 })
      + '<b>' + (_hwPosts.length ? 'Không có bài tập nào khớp' : 'Chưa có bài tập nào') + '</b>'
      + '<span>' + (_hwPosts.length ? 'Thử đổi bộ lọc hoặc từ khoá tìm kiếm.' : 'Khi quản lý đăng bài tập mới, bài sẽ hiện ở đây.') + '</span></div>';
    return;
  }
  var card = function(p){ return HwRender.cardHtml(p, HwIcon); };
  if(hasFilter || list.length <= 3){
    // Đang lọc/tìm kiếm, hoặc chỉ có ≤ 3 bài -> hiện hết, không thu gọn (giống thông báo ở index)
    box.innerHTML = list.map(card).join('');
    oldEl.innerHTML = ''; moreBtn.style.display = 'none';
  } else {
    box.innerHTML = list.slice(0, 3).map(card).join('');
    oldEl.innerHTML = list.slice(3).map(card).join('');
    moreBtn.style.display = 'block';
    hwSyncOld();
  }
  hwActivateGalleries();
}
function hwUpdateCounts(){
  document.getElementById('hwCntAll').textContent = _hwPosts.length;
  document.getElementById('hwCntToday').textContent = _hwPosts.filter(function(p){ return hwMatchesFilter(p, 'today'); }).length;
  document.getElementById('hwCntWeek').textContent = _hwPosts.filter(function(p){ return hwMatchesFilter(p, 'week'); }).length;
  document.getElementById('hwCntPinned').textContent = _hwPosts.filter(function(p){ return p.is_pinned; }).length;
}
async function hwLoad(manual){
  var btn = document.getElementById('hwRefreshBtn');
  if(manual && btn) btn.classList.add('spinning');
  try{
    var r = await supabaseClient.from('homework_posts').select('*')
      .eq('is_published', true)
      .order('is_pinned', { ascending: false })
      .order('homework_date', { ascending: false })
      .order('created_at', { ascending: false });
    if(r.error) throw r.error;
    _hwPosts = (r.data || []).map(function(p){ p._search = hwSearchText(p); return p; });
    hwUpdateCounts();
    hwApplyFilter();
  }catch(e){
    var missing = /does not exist|42P01|homework_posts/i.test((e && (e.message + (e.code || ''))) || '');
    document.getElementById('hwList').innerHTML = '<div class="hw-state">' + HwIcon.badge('alert', 'coral', { box:64, size:32 })
      + '<b>Không tải được bài tập</b><span>' + HwRender.esc(missing ? 'Chưa tạo bảng homework_posts trên Supabase. Hãy chạy file setup-homework.sql.' : ((e && e.message) || 'Lỗi không rõ')) + '</span></div>';
  }finally{
    if(btn) setTimeout(function(){ btn.classList.remove('spinning'); }, 400);
  }
}

/* Vào trang: KHÔNG cần đăng nhập nữa */
function hwStart(){
  if(_hwEntered) return;
  _hwEntered = true;
  hwHydrateIcons();
  hwLoad();
  try{
    _hwChannel = supabaseClient.channel('homework_posts_live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'homework_posts' }, function(){ hwLoad(); })
      .subscribe();
  }catch(e){}
  clearInterval(_hwPollTimer);
  _hwPollTimer = setInterval(function(){ if(!document.hidden) hwLoad(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) hwLoad(); });
}

hwStart();
</script>
