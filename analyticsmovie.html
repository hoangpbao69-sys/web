<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/movie-mobile-ui.css">
<script src="/movie-mobile-ui.js"></script>

<title>Thư Viện Phim · Analytics</title><link rel="icon" type="image/png" sizes="32x32" href="/movie-favicon-32.png"><link rel="icon" type="image/png" sizes="256x256" href="/movie-favicon-256.png"><link rel="apple-touch-icon" href="/movie-favicon-180.png"><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/movie-icons.js"></script>
<script src="/movie-auth.js"></script>
<style>
:root{--bg:oklch(97.6% .006 286);--surface:oklch(99.3% .003 286);--muted:oklch(94.8% .011 286);--ink:oklch(21% .032 286);--ink2:oklch(45% .022 286);--ink3:oklch(60% .016 286);--line:oklch(90.5% .012 286);--line2:oklch(85% .016 286);--primary:oklch(46% .168 286);--soft:oklch(94.5% .028 286);--jade:oklch(48% .09 168);--ochre:oklch(58% .13 62);--danger:oklch(52% .16 25);--shadow:0 12px 38px -20px oklch(21% .03 286/.25)}
[data-theme=dark]{--bg:oklch(15.5% .018 286);--surface:oklch(21.5% .023 286);--muted:oklch(19.5% .021 286);--ink:oklch(95% .008 286);--ink2:oklch(76% .014 286);--ink3:oklch(60% .018 286);--line:oklch(27% .022 286);--line2:oklch(34% .026 286);--primary:oklch(70% .125 286);--soft:oklch(28% .055 286);--jade:oklch(74% .1 168);--ochre:oklch(76% .115 72);--danger:oklch(70% .13 25);--shadow:0 12px 38px -20px oklch(8% .01 286/.65)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Be Vietnam Pro",system-ui,sans-serif}.wrap{width:min(1240px,calc(100% - 40px));margin:auto}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.serif{font-family:Lora,Georgia,serif}.muted{color:var(--ink3)}.eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--ink3)}
header{height:70px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:color-mix(in oklch,var(--bg) 92%,transparent);backdrop-filter:blur(10px)}.head{height:100%;display:flex;align-items:center;gap:22px}.brand{font:600 20px Lora,serif;white-space:nowrap}.brand b{color:var(--primary)}nav{display:flex;gap:4px}nav a,nav button{border:0;background:transparent;border-radius:9px;padding:9px 11px;color:var(--ink2);font-weight:600;font-size:13px}nav a:hover,nav a.on{background:var(--soft);color:var(--primary)}.menu-btn{display:none;width:38px;height:38px;padding:0;align-items:center;justify-content:center}.actions{margin-left:auto;display:flex;gap:8px;align-items:center}.theme{display:flex;padding:3px;border:1px solid var(--line);background:var(--muted);border-radius:999px}.theme button{border:0;background:transparent;border-radius:999px;padding:6px 9px;color:var(--ink3);font-size:12px}.theme button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px oklch(20% .02 286/.12)}.btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700}.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--bg)}.btn:hover{filter:brightness(1.06)}
main{padding:40px 0 80px}.topline{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.topline h1{font:600 40px/1.05 Lora,serif;margin:8px 0}.filters{display:flex;gap:8px;align-items:center}.filters select{border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);padding:9px 11px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:800}.kpi-value{font:600 30px/1 Lora,serif;margin-top:11px}.kpi-foot{font-size:11px;color:var(--jade);margin-top:8px}.kpi-foot.neutral{color:var(--ink3)}
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head h2{font-size:15px}.panel-body{padding:20px}.chart-wrap{height:285px;position:relative}.chart{width:100%;height:100%}.legend{display:flex;gap:14px;font-size:11px;color:var(--ink3)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--primary)}
.rank{display:grid;gap:0}.rank-row{display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}.rank-row:last-child{border:0}.rank-num{font:600 18px Lora,serif;color:var(--ink3)}.rank-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-meta{font-size:11px;color:var(--ink3);margin-top:2px}.bar{height:7px;border-radius:99px;background:var(--muted);margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:var(--primary)}.rank-value{font-variant-numeric:tabular-nums;font-size:12px;font-weight:800;color:var(--primary)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:11px 15px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:11px 15px;border-bottom:1px solid var(--line);color:var(--ink2)}.table tr:last-child td{border-bottom:0}.movie-cell{display:flex;align-items:center;gap:9px;min-width:220px}.movie-cell img{width:28px;height:39px;border-radius:4px;object-fit:cover;background:var(--muted)}.movie-cell strong{color:var(--ink);font-size:12px}.pill{display:inline-block;padding:3px 7px;border-radius:5px;background:var(--soft);color:var(--primary);font-size:10px;font-weight:800}.state{padding:48px 20px;text-align:center;color:var(--ink3);font-size:13px}.notice{margin-top:18px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:12px;color:var(--ink2)}.setup{max-width:650px;margin:80px auto}.setup h2{font:600 30px Lora,serif;margin:8px 0}.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--ink3)}.field input{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);color:var(--ink)}.field input:focus{outline:2px solid var(--primary);outline-offset:1px}.status{font-size:12px;margin-top:10px;min-height:18px}.status.ok{color:var(--jade)}.status.bad{color:var(--danger)}footer{border-top:1px solid var(--line);padding:24px 0;color:var(--ink3);font-size:12px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.topline{align-items:start;flex-direction:column}.wrap{width:min(100% - 28px,1240px)}.menu-btn{display:inline-flex}.head nav{display:none;position:absolute;top:70px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;max-height:calc(100vh - 70px);overflow:auto;box-shadow:var(--shadow);z-index:30}.head nav.open{display:flex}}@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr}.kpi{padding:13px}.kpi-value{font-size:24px}.filters{width:100%}.filters select{flex:1}}

.ic{display:inline-block;vertical-align:-3px;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px}
.rowbtn{display:inline-flex;align-items:center;gap:4px}
.theme button{display:inline-flex;align-items:center;gap:5px}
nav a{display:inline-flex;align-items:center;gap:6px}
.statcard,.metric{transition:transform .2s ease,box-shadow .2s ease}
.metric:hover{transform:translateY(-2px)}

/* ---- sửa lỗi menu: .btn ghi đè display của .menu-btn nên nút hamburger hiện cả trên laptop,
   làm thanh menu bị xuống dòng. Chỉ hiện hamburger khi màn hình hẹp (<=1280px). ---- */
.btn.menu-btn{display:none;width:38px;height:38px;padding:0;align-items:center;justify-content:center}
nav{flex-wrap:nowrap}
@media(max-width:1280px){
  .btn.menu-btn{display:inline-flex}
  .head nav{display:none;position:absolute;top:70px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;max-height:calc(100vh - 70px);overflow:auto;box-shadow:var(--shadow);z-index:30}
  .head nav.open{display:flex}
}
</style>
</head>
<body>
<header><div class="wrap head"><a class="brand" href="/indexmovie.html">THƯ VIỆN<b> PHIM</b> <small style="font:600 10px system-ui;color:var(--ink3)">analytics</small></a><button class="btn menu-btn" id="menuBtn" aria-label="Menu"></button><nav id="mainNav"><a class="on" href="#analytics">Analytics</a><a href="/indexmovie.html#/admin">Quản trị phim</a><a href="/adminmovie.html">Vận hành</a><a href="/adminmovie.html#/hero">Poster</a><a href="/" id="navHome">Trang chủ chính</a></nav><div class="actions"><div class="theme"><button data-t="light" class="on">Sáng</button><button data-t="dark">Tối</button></div><button class="btn" id="logoutBtn">Đăng xuất</button></div></div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">Analytics đọc dữ liệu từ Supabase. Chỉ dùng anon public key, bật RLS trước khi public.</div></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(n){return Number(n||0).toLocaleString('vi-VN')}
let period=7;
function theme(){let t=localStorage.getItem('tvp-analytics-theme')||'light';document.documentElement.dataset.theme=t;document.querySelectorAll('[data-t]').forEach(b=>{b.classList.toggle('on',b.dataset.t===t);b.onclick=()=>{t=b.dataset.t;document.documentElement.dataset.theme=t;localStorage.setItem('tvp-analytics-theme',t);document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===t));draw()}})}
function lineChart(data){let W=800,H=280,p={l:40,r:20,t:18,b:34},max=Math.max(...data.vals,1),iw=W-p.l-p.r,ih=H-p.t-p.b;let pts=data.vals.map((v,i)=>[p.l+i*(iw/Math.max(data.vals.length-1,1)),p.t+ih-v/max*ih]);let path=pts.map((x,i)=>(i?'L':'M')+x[0].toFixed(1)+' '+x[1].toFixed(1)).join(' ');let area=path+' L '+pts.at(-1)[0]+' '+(p.t+ih)+' L '+pts[0][0]+' '+(p.t+ih)+' Z';let grid=[0,.25,.5,.75,1].map(v=>{let y=p.t+ih-v*ih;return `<line x1="${p.l}" y1="${y}" x2="${W-p.r}" y2="${y}" stroke="var(--line)"/><text x="${p.l-8}" y="${y+4}" text-anchor="end" fill="var(--ink3)" font-size="10">${Math.round(max*v)}</text>`}).join('');let labs=data.labels.map((x,i)=>`<text x="${pts[i][0]}" y="${H-9}" text-anchor="middle" fill="var(--ink3)" font-size="10">${x}</text>`).join('');return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ lượt xem">${grid}<path d="${area}" fill="var(--soft)"/><path d="${path}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="4" fill="var(--surface)" stroke="var(--primary)" stroke-width="2"/>`).join('')}${labs}</svg>`}

async function analytics(){
  let since=new Date(Date.now()-period*86400000).toISOString(),rows=[];
  for(let off=0;off<10000;off+=1000){
    let r=await MV.rpc('movie_admin_views',{p_since:since,p_offset:off,p_limit:1000});
    if(r.error)throw r.error;
    rows.push(...(r.data||[]));
    if((r.data||[]).length<1000)break;
  }
  let byDay={};rows.forEach(x=>{let d=new Date(x.created_at).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});byDay[d]=(byDay[d]||0)+1});
  let labels=[],vals=[];for(let i=period-1;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let l=d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});labels.push(l);vals.push(byDay[l]||0)}
  let map={};rows.forEach(x=>{let k=x.film_slug;map[k]??={name:x.film_name||k,count:0};map[k].count++});
  let top=Object.values(map).sort((a,b)=>b.count-a.count).slice(0,5).map(x=>[x.name,x.count]);
  let unique=new Set(rows.map(x=>x.film_slug)).size;
  return{labels,vals,total:rows.length,unique,avg:Math.round(rows.length/period),top,rows};
}
function draw(){let a=$('#app');a.innerHTML=`<div class="topline"><div><span class="eyebrow">Thư Viện Phim · admin analytics</span><h1>Hiệu suất thư viện</h1><div class="muted">Theo dõi lượt xem và phim phổ biến theo thời gian thực.</div></div><div class="filters"><select id="period"><option value="7">7 ngày qua</option><option value="14">14 ngày qua</option><option value="30">30 ngày qua</option></select><button class="btn primary" id="refresh">${Icon('refresh',null,16)}Làm mới</button></div></div><div id="dash"><div class="state">Đang tải analytics...</div></div>`;$('#period').value=period;$('#period').onchange=e=>{period=+e.target.value;draw()};$('#refresh').onclick=draw;load()}
async function load(){try{let d=await analytics();let max=Math.max(...d.top.map(x=>x[1]),1);$('#dash').innerHTML=`<div class="kpis"><div class="kpi"><div class="kpi-label">Tổng lượt xem</div><div class="kpi-value">${fmt(d.total)}</div><div class="kpi-foot">Trong ${period} ngày</div></div><div class="kpi"><div class="kpi-label">Phim được xem</div><div class="kpi-value">${fmt(d.unique)}</div><div class="kpi-foot neutral">Slug duy nhất</div></div><div class="kpi"><div class="kpi-label">Trung bình/ngày</div><div class="kpi-value">${fmt(d.avg)}</div><div class="kpi-foot neutral">Lượt xem</div></div><div class="kpi"><div class="kpi-label">Top #1</div><div class="kpi-value" style="font-size:20px;line-height:1.2">${esc(d.top[0]?.[0]||'Chưa có')}</div><div class="kpi-foot">${fmt(d.top[0]?.[1]||0)} lượt xem</div></div></div><div class="layout"><section class="panel"><div class="panel-head"><h2>Lượt xem theo ngày</h2><div class="legend"><span><i class="dot"></i>Lượt xem</span></div></div><div class="panel-body"><div class="chart-wrap">${lineChart(d)}</div></div></section><section class="panel"><div class="panel-head"><h2>Phim phổ biến</h2><span class="muted">Top 5</span></div><div class="rank">${d.top.length?d.top.map((x,i)=>`<div class="rank-row"><div class="rank-num">0${i+1}</div><div><div class="rank-name">${esc(x[0])}</div><div class="bar"><i style="width:${Math.max(5,x[1]/max*100)}%"></i></div></div><div class="rank-value">${fmt(x[1])}</div></div>`).join(''):'<div class="state">Chưa có lượt xem.</div>'}</div></section></div><section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Chi tiết lượt xem gần đây</h2><span class="muted">${fmt(d.rows.length)} sự kiện</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Phim</th><th>Tập</th><th>Thời gian</th></tr></thead><tbody>${d.rows.slice(0,20).map(x=>`<tr><td><div class="movie-cell"><div><strong>${esc(x.film_name||x.film_slug)}</strong><div class="muted">${esc(x.film_slug)}</div></div></div></td><td><span class="pill">${esc(x.episode||'–')}</span></td><td>${new Date(x.created_at).toLocaleString('vi-VN')}</td></tr>`).join('')||'<tr><td colspan="3"><div class="state">Chưa có dữ liệu.</div></td></tr>'}</tbody></table></div></section><div class="notice">Dữ liệu lấy từ bảng movie_view_events; mỗi lần bắt đầu xem một tập sẽ ghi thêm 1 lượt xem. Chỉ tài khoản có quyền admin phim mới đọc được.</div>`}catch(e){$('#dash').innerHTML=`<div class="state">${esc(e.message)}<br><button class="btn primary" onclick="draw()" style="margin-top:12px">Thử lại</button></div>`}}

function paintIcons(){document.querySelectorAll('.theme button').forEach(b=>{const n=b.dataset.t==='dark'?'moon':'sun';b.innerHTML=Icon(n,null,15)});$('#logoutBtn').innerHTML=Icon('logout',null,16)+'Đăng xuất';const nh=$('#navHome');if(nh)nh.innerHTML=Icon('home',null,16)+'Trang chủ chính';$('#menuBtn').innerHTML=Icon('menu',null,18)}
paintIcons();
theme();$('#logoutBtn').onclick=()=>MV.logout();
$('#menuBtn').onclick=()=>$('#mainNav').classList.toggle('open');
MV.init({page:'Analytics phim',online:false,lock:false,requireAdmin:true}).then(draw);
</script>
</body>
</html>
